name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # job will only read code

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # jobs don't burn forever
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v
